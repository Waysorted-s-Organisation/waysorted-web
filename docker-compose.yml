services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - waysorted-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - 'try { rs.status().ok } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'

  web:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ./.env.docker.local
        required: true
    environment:
      MONGODB_URI: mongodb://mongo:27017/waysorted_local?replicaSet=rs0
      MONGODB_URI_TOOLS: mongodb://mongo:27017/waysorted_local?replicaSet=rs0
      NOTIFICATION_PRODUCER_ENABLED: "false"
      NOTIFICATION_N4_PRODUCER_ENABLED: "false"
      NOTIFICATION_N4_CANARY_TEST_ENABLED: "false"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --turbopack --hostname 0.0.0.0
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  figma-mcp:
    build: ./tools/figma-mcp
    profiles: ["figma"]
    ports:
      - "127.0.0.1:3845:3845"
    env_file:
      - path: ./tools/figma-mcp/.env
        required: false
    restart: unless-stopped

volumes:
  waysorted-mongo-data:
